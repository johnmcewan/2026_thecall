<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Article Match Review</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0f0f11;
    --surface: #18181c;
    --surface2: #202026;
    --border: #2e2e38;
    --text: #e8e8f0;
    --muted: #7a7a90;
    --high: #22c55e;
    --high-bg: #052010;
    --high-border: #166534;
    --border-bg: #1a1500;
    --border-border: #78350f;
    --border-text: #fbbf24;
    --none-bg: #14121c;
    --none-border: #312e81;
    --none-text: #818cf8;
    --confirm: #22c55e;
    --reject: #ef4444;
    --unsure: #f59e0b;
    --nite-accent: #38bdf8;
    --meta-accent: #a78bfa;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Header ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 28px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }
  .header h1 {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--text);
    flex-shrink: 0;
  }
  .header h1 span { color: var(--muted); font-weight: 400; }

  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    flex: 1;
  }
  .filter-btn {
    font-family: var(--mono);
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.04em;
  }
  .filter-btn:hover { border-color: var(--text); color: var(--text); }
  .filter-btn.active { background: var(--surface2); color: var(--text); border-color: var(--text); }
  .filter-btn.tier-HIGH.active { border-color: var(--high); color: var(--high); background: var(--high-bg); }
  .filter-btn.tier-BORDERLINE.active { border-color: var(--border-text); color: var(--border-text); background: var(--border-bg); }
  .filter-btn.tier-NONE.active { border-color: var(--none-text); color: var(--none-text); background: var(--none-bg); }

  .counter {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-left: auto;
    flex-shrink: 0;
  }
  .counter strong { color: var(--text); }

  /* ── Export bar ── */
  .export-bar {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    padding: 10px 28px;
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 12px;
    color: var(--muted);
  }
  .decision-tally { display: flex; gap: 16px; }
  .tally-item { font-family: var(--mono); }
  .tally-item .tally-n { font-weight: 600; margin-right: 4px; }
  .tally-confirm { color: var(--confirm); }
  .tally-reject  { color: var(--reject); }
  .tally-unsure  { color: var(--unsure); }
  .tally-pending { color: var(--muted); }
  .export-btn {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    padding: 6px 14px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: all 0.15s;
  }
  .export-btn:hover { border-color: var(--nite-accent); color: var(--nite-accent); }

  /* ── Main list ── */
  .main { padding: 20px 28px; display: flex; flex-direction: column; gap: 16px; }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .card:hover { border-color: #3e3e50; }
  .card.decided-CONFIRM { border-left: 3px solid var(--confirm); }
  .card.decided-REJECT  { border-left: 3px solid var(--reject); }
  .card.decided-UNSURE  { border-left: 3px solid var(--unsure); }

  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }
  .card-header:hover { background: var(--surface2); }

  .card-num {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    width: 28px;
    flex-shrink: 0;
  }

  .tier-badge {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 3px;
    letter-spacing: 0.08em;
    flex-shrink: 0;
  }
  .tier-HIGH       { background: var(--high-bg);    color: var(--high);        border: 1px solid var(--high-border); }
  .tier-BORDERLINE { background: var(--border-bg);  color: var(--border-text); border: 1px solid var(--border-border); }
  .tier-NO-MATCH   { background: var(--none-bg);    color: var(--none-text);   border: 1px solid var(--none-border); }

  .score-bar-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    width: 100px;
  }
  .score-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    flex: 1;
    overflow: hidden;
  }
  .score-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s;
  }
  .score-text {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    width: 38px;
    text-align: right;
  }

  .card-titles {
    flex: 1;
    min-width: 0;
    display: flex;
    gap: 8px;
    align-items: baseline;
    overflow: hidden;
  }
  .card-title-nite {
    font-size: 12px;
    font-weight: 500;
    color: var(--nite-accent);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 45%;
  }
  .card-title-sep { color: var(--muted); font-size: 12px; flex-shrink: 0; }
  .card-title-meta {
    font-size: 12px;
    color: var(--meta-accent);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-title-none {
    font-size: 12px;
    color: var(--muted);
    font-style: italic;
  }

  .decision-btns {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
    margin-left: auto;
  }
  .dec-btn {
    font-family: var(--mono);
    font-size: 10px;
    padding: 4px 10px;
    border-radius: 3px;
    border: 1px solid var(--border);
    background: transparent;
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: all 0.15s;
    color: var(--muted);
  }
  .dec-btn:hover { color: var(--text); border-color: var(--text); }
  .dec-btn.confirm:hover, .dec-btn.confirm.active { border-color: var(--confirm); color: var(--confirm); background: rgba(34,197,94,0.08); }
  .dec-btn.reject:hover,  .dec-btn.reject.active  { border-color: var(--reject);  color: var(--reject);  background: rgba(239,68,68,0.08); }
  .dec-btn.unsure:hover,  .dec-btn.unsure.active  { border-color: var(--unsure);  color: var(--unsure);  background: rgba(245,158,11,0.08); }

  .chevron {
    font-size: 10px;
    color: var(--muted);
    flex-shrink: 0;
    transition: transform 0.2s;
  }
  .card.expanded .chevron { transform: rotate(180deg); }

  /* ── Card body ── */
  .card-body {
    display: none;
    padding: 16px;
    border-top: 1px solid var(--border);
  }
  .card.expanded .card-body { display: block; }

  .columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .col-header {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    padding-bottom: 8px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .col-nite .col-header { color: var(--nite-accent); }
  .col-meta .col-header { color: var(--meta-accent); }

  .field { margin-bottom: 10px; }
  .field label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    display: block;
    margin-bottom: 3px;
    letter-spacing: 0.06em;
  }
  .field value {
    font-size: 12px;
    color: var(--text);
    display: block;
    line-height: 1.5;
  }
  .field value.body-text {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.7;
    color: #c0c0d8;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .source-path {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    word-break: break-all;
  }

  .meta-link {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--meta-accent);
    text-decoration: none;
    word-break: break-all;
  }
  .meta-link:hover { text-decoration: underline; }

  /* ── Second best match ── */
  .second-match {
    margin-top: 14px;
    padding: 10px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 11px;
    color: var(--muted);
  }
  .second-match strong { color: var(--text); font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; }

  /* ── Notes ── */
  .notes-row {
    margin-top: 14px;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .notes-row label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.06em;
    padding-top: 6px;
    flex-shrink: 0;
  }
  .notes-row textarea {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 12px;
    padding: 6px 8px;
    resize: vertical;
    min-height: 48px;
    outline: none;
    transition: border-color 0.15s;
  }
  .notes-row textarea:focus { border-color: var(--muted); }
  .notes-row textarea::placeholder { color: var(--muted); }

  /* ── NO MATCH section ── */
  .no-match-info {
    padding: 10px 14px;
    background: var(--none-bg);
    border: 1px solid var(--none-border);
    border-radius: 4px;
    color: var(--none-text);
    font-size: 12px;
    font-family: var(--mono);
    margin-bottom: 12px;
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>

const decisions = {};
const notes = {};

function tierClass(tier) {
  if (tier === 'HIGH') return 'tier-HIGH';
  if (tier === 'BORDERLINE') return 'tier-BORDERLINE';
  return 'tier-NO-MATCH';
}

function tierLabel(tier) {
  if (tier === 'HIGH') return '● HIGH';
  if (tier === 'BORDERLINE') return '◑ BORDERLINE';
  return '○ NO MATCH';
}

function scoreColor(score) {
  if (score >= 0.80) return '#22c55e';
  if (score >= 0.50) return '#f59e0b';
  return '#6366f1';
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function buildCard(m, idx) {
  const id = 'card-' + m.nite_idx;
  const sc = m.score;
  const isNoMatch = m.tier === 'NO MATCH';

  const titleSection = isNoMatch
    ? `<span class="card-title-none">No match found in metadata (best: ${sc} — ${escHtml(m.meta_title.substring(0,60))})</span>`
    : `<span class="card-title-nite" title="${escHtml(m.nite_title)}">${escHtml(m.nite_title.substring(0,70))}</span>
       <span class="card-title-sep">↔</span>
       <span class="card-title-meta" title="${escHtml(m.meta_title)}">${escHtml(m.meta_title.substring(0,70))}</span>`;

  const secondMatchHtml = (!isNoMatch && m.second_score > 0.2)
    ? `<div class="second-match"><strong>2ND BEST MATCH</strong> &nbsp; score: ${m.second_score} &nbsp;|&nbsp; ${escHtml(m.second_meta_title)} &nbsp;(${escHtml(m.second_meta_date)})</div>`
    : '';

  const bodyContent = isNoMatch
    ? `<div class="no-match-info">This nite article has no strong match in final_metadata_summary. It will appear as a nite-only record in the merged dataset.</div>
       <div class="field"><label>NITE TITLE</label><value>${escHtml(m.nite_title)}</value></div>
       <div class="field"><label>NITE SOURCE PATH</label><value class="source-path">${escHtml(m.nite_source)}</value></div>
       <div class="field"><label>NITE BODY (excerpt)</label><value class="body-text">${escHtml(m.nite_body)}</value></div>`
    : `<div class="columns">
        <div class="col col-nite">
          <div class="col-header">NITE ARTICLE &nbsp; db_id: ${m.nite_db_id}</div>
          <div class="field"><label>TITLE</label><value>${escHtml(m.nite_title)}</value></div>
          <div class="field"><label>SOURCE PATH</label><value class="source-path">${escHtml(m.nite_source)}</value></div>
          <div class="field"><label>BODY (excerpt)</label><value class="body-text">${escHtml(m.nite_body)}</value></div>
        </div>
        <div class="col col-meta">
          <div class="col-header">META ARTICLE &nbsp; StoreId: ${m.meta_store_id}</div>
          <div class="field"><label>TITLE</label><value>${escHtml(m.meta_title)}</value></div>
          <div class="field"><label>PUBDATE</label><value>${escHtml(m.meta_date)}</value></div>
          <div class="field"><label>BODY (excerpt)</label><value class="body-text">${escHtml(m.meta_body)}</value></div>
          <div class="field"><label>PROQUEST URL</label>
            ${m.meta_url ? `<a class="meta-link" href="${escHtml(m.meta_url)}" target="_blank" rel="noopener">${escHtml(m.meta_url.substring(0,80))}…</a>` : '<value class="source-path">—</value>'}
          </div>
        </div>
       </div>
       ${secondMatchHtml}`;

  return `
  <div class="card" id="${id}" data-idx="${m.nite_idx}" data-tier="${m.tier}" data-score="${sc}">
    <div class="card-header" onclick="toggleCard('${id}')">
      <span class="card-num">${String(idx+1).padStart(3,'0')}</span>
      <span class="tier-badge ${tierClass(m.tier)}">${tierLabel(m.tier)}</span>
      <div class="score-bar-wrap">
        <div class="score-bar"><div class="score-fill" style="width:${(sc*100).toFixed(1)}%;background:${scoreColor(sc)}"></div></div>
        <span class="score-text">${sc.toFixed(3)}</span>
      </div>
      <div class="card-titles">${titleSection}</div>
      <div class="decision-btns" onclick="event.stopPropagation()">
        <button class="dec-btn confirm" onclick="setDecision('${id}','CONFIRM')">✓ MATCH</button>
        <button class="dec-btn unsure"  onclick="setDecision('${id}','UNSURE')">? UNSURE</button>
        <button class="dec-btn reject"  onclick="setDecision('${id}','REJECT')">✕ NO MATCH</button>
      </div>
      <span class="chevron">▼</span>
    </div>
    <div class="card-body">
      ${bodyContent}
      <div class="notes-row">
        <label>NOTES</label>
        <textarea placeholder="Add notes here…" oninput="saveNote('${id}', this.value)"></textarea>
      </div>
    </div>
  </div>`;
}

function renderAll() {
  const list = document.getElementById('card-list');
  list.innerHTML = MATCH_DATA.map((m, i) => buildCard(m, i)).join('');
}

function toggleCard(id) {
  document.getElementById(id).classList.toggle('expanded');
}

function setDecision(id, dec) {
  const card = document.getElementById(id);
  const idx = card.dataset.idx;
  decisions[idx] = dec;
  card.className = card.className.replace(/decided-\S+/g,'').trim();
  card.classList.add('decided-' + dec);
  // Update button states
  card.querySelectorAll('.dec-btn').forEach(b => b.classList.remove('active'));
  const map = { CONFIRM: 'confirm', UNSURE: 'unsure', REJECT: 'reject' };
  card.querySelector('.' + map[dec]).classList.add('active');
  updateTally();
  applyFilter(currentFilter);
}

function saveNote(id, val) {
  const card = document.getElementById(id);
  notes[card.dataset.idx] = val;
}

let currentFilter = 'ALL';
function applyFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === filter));
  let visible = 0;
  document.querySelectorAll('.card').forEach(card => {
    const tier = card.dataset.tier;
    const dec = decisions[card.dataset.idx] || 'PENDING';
    let show = false;
    if (filter === 'ALL') show = true;
    else if (filter === 'HIGH') show = tier === 'HIGH';
    else if (filter === 'BORDERLINE') show = tier === 'BORDERLINE';
    else if (filter === 'NO MATCH') show = tier === 'NO MATCH';
    else if (filter === 'CONFIRM') show = dec === 'CONFIRM';
    else if (filter === 'REJECT') show = dec === 'REJECT';
    else if (filter === 'UNSURE') show = dec === 'UNSURE';
    else if (filter === 'PENDING') show = dec === 'PENDING';
    card.style.display = show ? '' : 'none';
    if (show) visible++;
  });
  document.getElementById('visible-count').textContent = visible;
}

function updateTally() {
  const counts = { CONFIRM: 0, REJECT: 0, UNSURE: 0 };
  Object.values(decisions).forEach(d => { if (counts[d] !== undefined) counts[d]++; });
  document.getElementById('t-confirm').textContent = counts.CONFIRM;
  document.getElementById('t-reject').textContent  = counts.REJECT;
  document.getElementById('t-unsure').textContent  = counts.UNSURE;
  document.getElementById('t-pending').textContent = MATCH_DATA.length - counts.CONFIRM - counts.REJECT - counts.UNSURE;
}

function exportDecisions() {
  const output = MATCH_DATA.map(m => ({
    nite_idx: m.nite_idx,
    nite_db_id: m.nite_db_id,
    nite_title: m.nite_title,
    tier: m.tier,
    score: m.score,
    meta_idx: m.meta_idx,
    meta_title: m.meta_title,
    meta_date: m.meta_date,
    meta_store_id: m.meta_store_id,
    decision: decisions[m.nite_idx] || 'PENDING',
    notes: notes[m.nite_idx] || ''
  }));
  const blob = new Blob([JSON.stringify(output, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'match_decisions.json';
  a.click();
}

document.querySelectorAll('.filter-btn').forEach(b => {
  b.addEventListener('click', () => applyFilter(b.dataset.filter));
});

renderAll();
// Re-attach filter listeners after render
document.querySelectorAll('.filter-btn').forEach(b => {
  b.addEventListener('click', () => applyFilter(b.dataset.filter));
});
</script>
