<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e0c;
    --surface: #181714;
    --surface2: #201e1a;
    --border: #2e2b25;
    --border-accent: #4a4438;
    --gold: #c9a84c;
    --gold-dim: #7a6430;
    --text: #d4cfc6;
    --text-dim: #7a7468;
    --text-bright: #ede8de;
    --red: #c05a3a;
    --mono: 'IBM Plex Mono', monospace;
    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'IBM Plex Sans', sans-serif;
    --sidebar-w: 280px;
    --list-w: 320px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── TOP BAR ── */
  header {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
  }

  .logo {
    font-family: var(--serif);
    font-size: 18px;
    color: var(--gold);
    letter-spacing: 0.04em;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .logo span { font-style: italic; color: var(--text-dim); font-size: 12px; margin-left: 6px; font-family: var(--sans); }

  .search-group {
    display: flex;
    gap: 10px;
    flex: 1;
    align-items: center;
  }

  .search-field {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 10px;
    transition: border-color 0.15s;
  }
  .search-field:focus-within { border-color: var(--gold-dim); }
  .search-field label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .search-field input {
    background: none;
    border: none;
    outline: none;
    color: var(--text-bright);
    font-family: var(--mono);
    font-size: 13px;
    width: 100%;
    min-width: 60px;
  }
  .search-field input::placeholder { color: var(--text-dim); }

  .load-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    background: var(--gold);
    color: var(--bg);
    border: none;
    border-radius: 4px;
    font-family: var(--sans);
    font-weight: 500;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: opacity 0.15s;
  }
  .load-btn:hover { opacity: 0.85; }
  .load-btn svg { width: 14px; height: 14px; }

  .stat-badge {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .stat-badge strong { color: var(--gold); }

  /* ── MAIN LAYOUT ── */
  .workspace {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── RESULTS LIST ── */
  .results-panel {
    width: var(--list-w);
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    background: var(--surface);
    overflow: hidden;
  }

  .panel-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  .results-list {
    overflow-y: auto;
    flex: 1;
  }
  .results-list::-webkit-scrollbar { width: 4px; }
  .results-list::-webkit-scrollbar-track { background: transparent; }
  .results-list::-webkit-scrollbar-thumb { background: var(--border-accent); border-radius: 2px; }

  .result-item {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
    position: relative;
  }
  .result-item:hover { background: var(--surface2); }
  .result-item.active {
    background: var(--surface2);
    border-left: 2px solid var(--gold);
  }
  .result-item .item-id {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--gold);
    margin-bottom: 3px;
  }
  .result-item .item-title {
    font-size: 13px;
    color: var(--text-bright);
    line-height: 1.35;
    margin-bottom: 4px;
  }
  .result-item .item-meta {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    display: flex;
    gap: 8px;
  }
  .result-item .item-tags {
    display: flex;
    gap: 4px;
    margin-top: 5px;
  }
  .tag {
    font-family: var(--mono);
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 2px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .tag-t { background: rgba(201,168,76,0.12); color: var(--gold); }
  .tag-j { background: rgba(100,150,200,0.12); color: #8ab4d4; }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 12px;
    color: var(--text-dim);
    padding: 20px;
    text-align: center;
  }
  .empty-state svg { opacity: 0.3; }
  .empty-state p { font-size: 13px; line-height: 1.6; }
  .empty-state .drop-hint {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--gold-dim);
    margin-top: 8px;
    padding: 6px 10px;
    border: 1px dashed var(--gold-dim);
    border-radius: 4px;
  }

  /* ── DETAIL VIEW ── */
  .detail-panel {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    background: var(--surface);
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .sidebar::-webkit-scrollbar { width: 3px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border-accent); border-radius: 2px; }

  .sidebar-section {}
  .sidebar-section-title {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .meta-field {
    margin-bottom: 12px;
  }
  .meta-label {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 3px;
  }
  .meta-value {
    font-size: 13px;
    color: var(--text-bright);
    line-height: 1.4;
    word-break: break-all;
  }
  .meta-value.mono {
    font-family: var(--mono);
    font-size: 12px;
  }
  .meta-value.title-val {
    font-family: var(--serif);
    font-size: 15px;
    font-style: italic;
    line-height: 1.4;
    word-break: normal;
  }
  .meta-value.path-val {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    word-break: break-all;
    line-height: 1.5;
  }

  .no-selection {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    color: var(--text-dim);
    font-family: var(--serif);
    font-size: 16px;
    font-style: italic;
  }

  /* ── TRANSCRIPT AREA ── */
  .transcript-area {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .transcript-header {
    display: flex;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--surface);
  }

  .col-header {
    flex: 1;
    padding: 10px 16px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .col-header:first-child { border-right: 1px solid var(--border); }
  .col-header .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-t { background: var(--gold); }
  .dot-j { background: #8ab4d4; }

  .transcript-columns {
    flex: 1;
    overflow: hidden;
    display: flex;
  }

  .transcript-col {
    flex: 1;
    overflow-y: auto;
    padding: 20px 18px;
    font-size: 13px;
    line-height: 1.75;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .transcript-col:first-child { border-right: 1px solid var(--border); }
  .transcript-col::-webkit-scrollbar { width: 4px; }
  .transcript-col::-webkit-scrollbar-track { background: transparent; }
  .transcript-col::-webkit-scrollbar-thumb { background: var(--border-accent); border-radius: 2px; }

  .transcript-col.json-readable p {
    margin-bottom: 0.9em;
  }
  .transcript-col.json-readable p:last-child {
    margin-bottom: 0;
  }

  .transcript-col.only-col {
    border-right: none;
  }

  .empty-col {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 11px;
    font-style: italic;
  }

  mark {
    background: rgba(201,168,76,0.28);
    color: var(--gold);
    border-radius: 2px;
    padding: 0 1px;
  }

  /* ── DROP OVERLAY ── */
  .drop-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,14,12,0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .drop-overlay.active { opacity: 1; pointer-events: all; }
  .drop-box {
    border: 2px dashed var(--gold);
    border-radius: 8px;
    padding: 60px 80px;
    text-align: center;
  }
  .drop-box p {
    font-family: var(--serif);
    font-size: 22px;
    color: var(--gold);
    margin-top: 14px;
  }
  .drop-box small {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 8px;
    display: block;
  }

  /* ── SINGLE-COL MODE (only one text) ── */
  .transcript-col.full-width {
    border-right: none;
  }

  /* ── HIDDEN FILE INPUT ── */
  #file-input { display: none; }
</style>
</head>
<body>

<!-- TOP BAR -->
<header>
  <div class="logo">Archive Viewer <span>nite</span></div>

  <div class="search-group">
    <div class="search-field" style="flex:0 0 200px;">
      <label>Article ID</label>
      <input type="text" id="search-id" placeholder="e.g. 69" oninput="applyFilters()">
    </div>

    <div class="search-field" style="flex:1;">
      <label>Full-text</label>
      <input type="text" id="search-text" placeholder="Search transcripts &amp; JSON…" oninput="applyFilters()">
    </div>
  </div>

  <div class="stat-badge" id="stat-badge">No file loaded</div>

  <button class="load-btn" onclick="document.getElementById('file-input').click()">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M8 1v9M4 6l4-4 4 4M2 13h12"/>
    </svg>
    Load CSV
  </button>
  <input type="file" id="file-input" accept=".csv" onchange="loadFile(event)">
</header>

<!-- WORKSPACE -->
<div class="workspace">

  <!-- RESULTS LIST -->
  <div class="results-panel">
    <div class="panel-header" id="list-header">Results</div>
    <div class="results-list" id="results-list">
      <div class="empty-state">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="8" y="4" width="28" height="36" rx="2"/>
          <path d="M8 4h20l8 8v28a2 2 0 01-2 2H10a2 2 0 01-2-2V6a2 2 0 012-2z"/>
          <path d="M28 4v8h8M14 18h20M14 24h14M14 30h10"/>
        </svg>
        <p>Load a CSV file to begin browsing archive entries.</p>
        <div class="drop-hint">or drag &amp; drop a .csv file anywhere</div>
      </div>
    </div>
  </div>

  <!-- DETAIL PANEL -->
  <div class="detail-panel" id="detail-panel">
    <div class="no-selection" id="no-selection">
      Select an entry to view its content
    </div>
  </div>

</div>

<!-- DROP OVERLAY -->
<div class="drop-overlay" id="drop-overlay">
  <div class="drop-box">
    <svg width="56" height="56" viewBox="0 0 56 56" fill="none" stroke="#c9a84c" stroke-width="1.5">
      <rect x="10" y="6" width="36" height="44" rx="3"/>
      <path d="M10 6h24l12 12v32a3 3 0 01-3 3H13a3 3 0 01-3-3V9a3 3 0 013-3z"/>
      <path d="M34 6v12h12M22 28v12M16 34l6-6 6 6"/>
    </svg>
    <p>Drop CSV to load</p>
    <small>Accepts .csv with the archive schema</small>
  </div>
</div>

<script>
let allRows = [];
let filteredRows = [];
let activeIndex = null;

// ── FILE LOADING ──
function loadFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  parseCSV(file);
}

function parseCSV(file) {
  Papa.parse(file, {
    header: true,
    skipEmptyLines: true,
    complete(results) {
      allRows = results.data;
      applyFilters();
      updateStat();
    },
    error(err) {
      alert('Error parsing CSV: ' + err.message);
    }
  });
}

// ── FILTERS ──
function applyFilters() {
  const idQuery = document.getElementById('search-id').value.trim().toLowerCase();
  const textQuery = document.getElementById('search-text').value.trim().toLowerCase();

  filteredRows = allRows.filter(row => {
    if (idQuery) {
      const id = String(row.id_articles_nite || '').toLowerCase();
      if (!id.includes(idQuery)) return false;
    }
    if (textQuery) {
      const transcript = String(row.full_transcript || '').toLowerCase();
      const json = String(row.json_unified || '').toLowerCase();
      if (!transcript.includes(textQuery) && !json.includes(textQuery)) return false;
    }
    return true;
  });

  renderList();
  updateStat();

  // Auto-select first if previous selection gone
  if (activeIndex !== null) {
    const stillThere = filteredRows.some(r => r._origIndex === activeIndex);
    if (!stillThere) { activeIndex = null; renderDetail(null); }
  }
}

// ── RENDER LIST ──
function renderList() {
  const container = document.getElementById('results-list');
  const header = document.getElementById('list-header');
  header.textContent = `${filteredRows.length} result${filteredRows.length !== 1 ? 's' : ''}`;

  if (filteredRows.length === 0) {
    container.innerHTML = `<div class="empty-state">
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="16" cy="16" r="11"/><path d="M25 25l7 7"/>
      </svg>
      <p>No entries match your search.</p>
    </div>`;
    return;
  }

  const textQuery = document.getElementById('search-text').value.trim();

  container.innerHTML = filteredRows.map((row, i) => {
    const hasT = !!(row.full_transcript && row.full_transcript.trim());
    const hasJ = !!(row.json_unified && row.json_unified.trim());
    const isActive = activeIndex === i ? 'active' : '';
    return `<div class="result-item ${isActive}" onclick="selectItem(${i})">
      <div class="item-id">#${escHtml(row.id_articles_nite || '—')}</div>
      <div class="item-title">${escHtml(truncate(row.title || 'Untitled', 60))}</div>
      <div class="item-meta">
        <span>${escHtml(row.publish_year || '?')}</span>
        <span>${escHtml(truncate(row.filename || '', 24))}</span>
      </div>
      <div class="item-tags">
        ${hasT ? '<span class="tag tag-t">Transcript</span>' : ''}
        ${hasJ ? '<span class="tag tag-j">JSON</span>' : ''}
      </div>
    </div>`;
  }).join('');
}

// ── SELECT ITEM ──
function selectItem(i) {
  activeIndex = i;
  // Update active class
  document.querySelectorAll('.result-item').forEach((el, idx) => {
    el.classList.toggle('active', idx === i);
  });
  renderDetail(filteredRows[i]);
}

// ── RENDER DETAIL ──
function renderDetail(row) {
  const panel = document.getElementById('detail-panel');
  const noSel = document.getElementById('no-selection');

  if (!row) {
    panel.innerHTML = `<div class="no-selection" id="no-selection">Select an entry to view its content</div>`;
    return;
  }

  const hasT = !!(row.full_transcript && row.full_transcript.trim());
  const rawJ = row.json_unified && row.json_unified.trim();
  const hasJ = !!rawJ;
  const textQuery = document.getElementById('search-text').value.trim();

  const tContent = hasT ? highlight(escHtml(row.full_transcript), textQuery) : '';
  const jContent = hasJ ? renderJsonAsText(rawJ, textQuery) : '';

  // Determine layout
  let colsHtml = '';
  if (hasT && hasJ) {
    colsHtml = `
      <div class="transcript-header">
        <div class="col-header"><span class="dot dot-t"></span>full_transcript</div>
        <div class="col-header"><span class="dot dot-j"></span>json_unified</div>
      </div>
      <div class="transcript-columns">
        <div class="transcript-col">${tContent}</div>
        <div class="transcript-col json-readable">${jContent}</div>
      </div>`;
  } else if (hasT) {
    colsHtml = `
      <div class="transcript-header">
        <div class="col-header"><span class="dot dot-t"></span>full_transcript</div>
      </div>
      <div class="transcript-columns">
        <div class="transcript-col only-col">${tContent}</div>
      </div>`;
  } else if (hasJ) {
    colsHtml = `
      <div class="transcript-header">
        <div class="col-header"><span class="dot dot-j"></span>json_unified</div>
      </div>
      <div class="transcript-columns">
        <div class="transcript-col json-readable only-col">${jContent}</div>
      </div>`;
  } else {
    colsHtml = `<div class="no-selection">No textual content for this entry.</div>`;
  }

  panel.innerHTML = `
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-section-title">Record</div>
        <div class="meta-field">
          <div class="meta-label">ID Article Nite</div>
          <div class="meta-value mono">${escHtml(row.id_articles_nite || '—')}</div>
        </div>
        <div class="meta-field">
          <div class="meta-label">Store ID</div>
          <div class="meta-value mono">${escHtml(row.store_id || '—')}</div>
        </div>
        <div class="meta-field">
          <div class="meta-label">FK Filelist</div>
          <div class="meta-value mono">${escHtml(row.fk_filelist || '—')}</div>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-title">Publication</div>
        <div class="meta-field">
          <div class="meta-label">Title</div>
          <div class="meta-value title-val">${escHtml(row.title || '—')}</div>
        </div>
        <div class="meta-field">
          <div class="meta-label">Year</div>
          <div class="meta-value mono">${escHtml(row.publish_year || '—')}</div>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-title">File</div>
        <div class="meta-field">
          <div class="meta-label">Filename</div>
          <div class="meta-value mono">${escHtml(row.filename || '—')}</div>
        </div>
        <div class="meta-field">
          <div class="meta-label">Folder</div>
          <div class="meta-value path-val">${escHtml(row.folder || '—')}</div>
        </div>
      </div>
    </div>

    <div class="transcript-area">
      ${colsHtml}
    </div>`;
}

// ── JSON → READABLE TEXT ──
function renderJsonAsText(jsonStr, query) {
  let data;
  try { data = JSON.parse(jsonStr); } catch(e) {
    // Fallback: just show raw with no JSON markup
    return highlight(escHtml(jsonStr), query);
  }

  // Prefer text_plain — it's the cleanest full reading copy
  let text = data.text_plain || '';

  // If no text_plain, assemble from frames → paragraphs
  if (!text) {
    const parts = [];
    for (const frame of (data.frames || [])) {
      if (frame.paragraphs && frame.paragraphs.length) {
        for (const p of frame.paragraphs) { if (p.text) parts.push(p.text); }
      } else if (frame.text) {
        parts.push(frame.text);
      }
    }
    text = parts.join('\n');
  }

  // Decode custom HTML-like entities used in this archive
  text = text
    .replace(/&hTab;/g, '\t')
    .replace(/&punctSpace;/g, '\u2008')   // punctuation space
    .replace(/&amp;/g, '&')
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"')
    .replace(/&#39;/g, "'")
    .replace(/&[a-zA-Z]+;/g, ' ');        // strip any remaining unknown entities

  // Convert newlines to paragraphs for readable layout
  const paras = text.split(/\n+/).map(p => p.trim()).filter(Boolean);
  const html = paras.map(p => `<p>${highlight(escHtml(p), query)}</p>`).join('');
  return html;
}

// ── HELPERS ──
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function truncate(str, len) {
  return str.length > len ? str.slice(0, len) + '…' : str;
}

function highlight(text, query) {
  if (!query) return text;
  // Escape query for regex use in the already-escaped text
  const safeQ = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  // We need to highlight case-insensitively. Since text is HTML-escaped we search on that.
  return text.replace(new RegExp(safeQ, 'gi'), m => `<mark>${m}</mark>`);
}

function updateStat() {
  const badge = document.getElementById('stat-badge');
  if (allRows.length === 0) {
    badge.innerHTML = 'No file loaded';
    return;
  }
  badge.innerHTML = `<strong>${filteredRows.length}</strong> / ${allRows.length} entries`;
}

// ── DRAG & DROP ──
const overlay = document.getElementById('drop-overlay');
let dragCounter = 0;

document.addEventListener('dragenter', e => {
  e.preventDefault();
  dragCounter++;
  overlay.classList.add('active');
});
document.addEventListener('dragleave', e => {
  dragCounter--;
  if (dragCounter <= 0) { dragCounter = 0; overlay.classList.remove('active'); }
});
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  dragCounter = 0;
  overlay.classList.remove('active');
  const file = e.dataTransfer.files[0];
  if (file && file.name.endsWith('.csv')) parseCSV(file);
});
</script>
